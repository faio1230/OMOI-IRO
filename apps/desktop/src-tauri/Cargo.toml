[package]
name = "omoiiro-desktop"
description = "OMOI-IRO desktop shell (Tauri 2): starts and stops the Rust runtime, typed IPC commands for the React UI"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "omoiiro_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "omoiiro"
path = "src/main.rs"

[features]
default = []
# Ableton Link beat source (needs cmake and libclang; see BUILD.md).
link = ["omoiiro-runtime/link"]

[build-dependencies]
tauri-build.workspace = true

[dependencies]
omoiiro-core.workspace = true
omoiiro-devices.workspace = true
omoiiro-midi.workspace = true
omoiiro-store.workspace = true
omoiiro-runtime.workspace = true
tauri.workspace = true
tauri-plugin-dialog.workspace = true
serde.workspace = true
serde_json.workspace = true
crossbeam-channel.workspace = true
